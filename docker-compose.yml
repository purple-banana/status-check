# Bring your own Postgres: set DATABASE_URL in .env.
# No Postgres yet? `docker compose --profile db up -d` also starts one.

# No depends_on: the worker exits until Postgres accepts connections and restarts itself,
# which also works when Postgres lives elsewhere and on older Compose versions.
x-app: &app
  build: .
  image: status-check
  restart: unless-stopped
  env_file: .env

services:
  worker:
    <<: *app
    command: ["node", "src/worker/main.ts"]

  mcp:
    <<: *app
    command: ["node", "src/mcp/main.ts"]
    # Localhost only: put a TLS reverse proxy in front, or set BIND=0.0.0.0 to expose it directly.
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:17-alpine
    profiles: ["db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: status
      POSTGRES_PASSWORD: status
      POSTGRES_DB: status
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U status"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
